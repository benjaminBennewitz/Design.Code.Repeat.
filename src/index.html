<!doctype html>
<html lang="de" data-theme="dark" class="dcr-initial-load dcr-app-hidden">
<head>
  <meta charset="utf-8">
  <title>Design. Code. Repeat. | Webentwicklung, Software & Design</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Design. Code. Repeat. entwickelt Websites, Webanwendungen, individuelle Software und digitale Interfaces – inklusive Wartung und Managed Hosting.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0b0d0f">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Design. Code. Repeat.">
  <meta property="og:title" content="Design. Code. Repeat. | Webentwicklung, Software &amp; Design">
  <meta property="og:description" content="Webentwicklung, individuelle Software, UI/UX, Wartung und Managed Hosting aus Mönchengladbach.">
  <meta property="og:url" content="https://design-code-repeat.de/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Design. Code. Repeat. | Webentwicklung, Software &amp; Design">
  <meta name="twitter:description" content="Webentwicklung, individuelle Software, UI/UX, Wartung und Managed Hosting aus Mönchengladbach.">
  <link rel="canonical" href="https://design-code-repeat.de/">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <style>
    html { scrollbar-gutter: stable; }
    html.dcr-initial-load,
    html.dcr-initial-load body { overflow: hidden; }
    dcr-root { display: block; min-height: 100svh; }
    html.dcr-app-hidden dcr-root { visibility: hidden; }

    .site-loader {
      position: fixed;
      z-index: 1000;
      inset: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 2rem;
      min-height: 100svh;
      padding: clamp(1.25rem, 3vw, 3rem);
      overflow: hidden;
      background: #080808;
      color: #fff;
      opacity: 1;
      visibility: visible;
    }
    .site-loader::before {
      position: absolute;
      inset: 0;
      content: '';
      background: linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);
      background-size: 12.5% 12.5%;
      opacity: .45;
      transform: scale(1.08);
      animation: dcr-loader-grid 3s ease-out forwards;
      pointer-events: none;
    }

    .site-loader__meta,
    .site-loader__footer {
      position: relative;
      z-index: 2;
      font: 800 clamp(.62rem,.72vw,.72rem)/1.15 Consolas, ui-monospace, monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .site-loader__meta,
    .site-loader__footer > div:last-child { display: flex; gap: 1rem; justify-content: space-between; }
    .site-loader__core {
      position: relative;
      z-index: 2;
      display: grid;
      width: 100%;
      grid-template-columns: max-content clamp(4rem,8.5vw,8.5rem) max-content;
      grid-template-rows: auto auto;
      gap: .06em .12em;
      align-content: center;
      align-items: center;
      justify-content: center;
      font-family: Impact, 'Arial Black', sans-serif;
      font-size: clamp(3.6rem,10.5vw,10.5rem);
      line-height: .78;
      letter-spacing: -.075em;
    }

    .site-loader__word { display: inline-flex; align-items: baseline; gap: .14em; opacity: 0; transform: translateY(65%) skewY(7deg); animation: dcr-loader-word 720ms cubic-bezier(.22,1,.36,1) forwards; }
    .site-loader__dot { letter-spacing: 0; }
    .site-loader__word--lcp { opacity: 1; transform: none; animation: none; }
    .site-loader__word:nth-child(3) { animation-delay: 500ms; }
    .site-loader__word--accent { grid-column: 1 / -1; justify-self: center; color: #67a2ff; animation-delay: 760ms; }
    .site-loader__mark { position: relative; width: 100%; aspect-ratio: 1; }
    .site-loader__symbol {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #67a2ff;
      color: #080808;
      opacity: 0;
      animation: dcr-loader-symbol 3s cubic-bezier(.22,1,.36,1) infinite;
    }
    .site-loader__symbol--grid::before,
    .site-loader__symbol--grid::after {
      position: absolute;
      width: 58%;
      height: 16%;
      content: '';
      background: currentColor;
    }
    .site-loader__symbol--grid::after { transform: rotate(90deg); }
    .site-loader__symbol--cluster {
      grid-template-columns: repeat(2,1fr);
      gap: 8%;
      padding: 7%;
      background: #ff4ca5;
      animation-delay: -2s;
    }
    .site-loader__symbol--cluster i {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50% 14% 50% 16%;
      background: currentColor;
      transform: rotate(45deg);
    }
    .site-loader__symbol--code {
      background: #adff2f;
      clip-path: polygon(22% 0,78% 0,100% 22%,100% 78%,78% 100%,22% 100%,0 78%,0 22%);
      font: 900 clamp(.8rem,2.5vw,2.5rem)/1 Consolas, ui-monospace, monospace;
      letter-spacing: -.12em;
      animation-delay: -1s;
    }
    .site-loader__footer { display: grid; gap: .75rem; }
    .site-loader__progress { height: .45rem; overflow: hidden; background: rgba(255,255,255,.2); }
    .site-loader__progress span { display: block; width: 100%; height: 100%; background: #67a2ff; transform: scaleX(0); transform-origin: left; animation: dcr-loader-progress 3s linear forwards; }

    @keyframes dcr-loader-word { to { opacity: 1; transform: none; } }
    @keyframes dcr-loader-progress { to { transform: scaleX(1); } }
    @keyframes dcr-loader-grid { to { opacity: .16; transform: scale(1); } }
    @keyframes dcr-loader-symbol {
      0%, 27% { opacity: 1; transform: rotate(0) scale(1); }
      33%, 94% { opacity: 0; transform: rotate(65deg) scale(.65); }
      100% { opacity: 1; transform: rotate(0) scale(1); }
    }

    @media (max-width: 680px) {
      .site-loader { padding: 1rem; }
      .site-loader__core { grid-template-columns: max-content clamp(2.35rem,12vw,4rem) max-content; gap: .06em; font-size: clamp(1.85rem,9.5vw,4rem); }
      .site-loader__word { white-space: nowrap; }
      .site-loader__meta span:last-child,
      .site-loader__footer > div:last-child span:last-child { display: none; }
    }

    :root:is([data-motion='reduced'], [data-motion='off'], [data-comfort='simple']) .site-loader::before,
    :root:is([data-motion='reduced'], [data-motion='off'], [data-comfort='simple']) .site-loader__symbol {
      animation: none;
      opacity: 0;
    }
    :root:is([data-motion='reduced'], [data-motion='off'], [data-comfort='simple']) .site-loader__symbol--grid { opacity: 1; }
    :root:is([data-motion='reduced'], [data-motion='off'], [data-comfort='simple']) .site-loader__word {
      opacity: 1;
      transform: none;
      animation: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .site-loader::before,
      .site-loader__symbol { animation: none; opacity: 0; }
      .site-loader__symbol--grid { opacity: 1; }
      .site-loader__word { opacity: 1; transform: none; animation: none; }
    }
  </style>
</head>
<body>
  <dcr-root></dcr-root>

  <div id="dcr-site-loader" class="site-loader" role="status" aria-live="polite" aria-busy="true" aria-label="Website wird geladen">
    <div class="site-loader__meta" aria-hidden="true">
      <span>B² // DESIGN. CODE. REPEAT.</span>
      <span>SYSTEMSTART</span>
    </div>

    <div class="site-loader__core" aria-hidden="true">
      <span class="site-loader__word site-loader__word--lcp">DESIGN<span class="site-loader__dot">.</span></span>
      <span class="site-loader__mark">
        <span class="site-loader__symbol site-loader__symbol--grid"></span>
        <span class="site-loader__symbol site-loader__symbol--cluster"><i></i><i></i><i></i><i></i></span>
        <span class="site-loader__symbol site-loader__symbol--code">&lt;/&gt;</span>
      </span>
      <span class="site-loader__word">CODE<span class="site-loader__dot">.</span></span>
      <span class="site-loader__word site-loader__word--accent">REPEAT<span class="site-loader__dot">.</span></span>
    </div>

    <div class="site-loader__footer" aria-hidden="true">
      <div class="site-loader__progress"><span></span></div>
      <div><span>INITIALIZING EXPERIENCE</span><span>03.0 SEC</span></div>
    </div>
  </div>

  <script src="/loader-init.js"></script>
</body>
</html>
