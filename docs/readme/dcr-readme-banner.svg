<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Design. Code. Repeat. Studio</title>
  <desc id="desc">Dunkles technisches Banner mit Raster, Lime-, Blau- und Pink-Akzenten sowie der Wortmarke Design. Code. Repeat.</desc>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#f7f2e9" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="520" fill="#0b0d0f"/>
  <rect width="1600" height="520" fill="url(#grid)"/>

  <rect x="0" y="0" width="18" height="520" fill="#adff2f"/>
  <rect x="18" y="0" width="8" height="520" fill="#67a2ff"/>
  <rect x="26" y="0" width="5" height="520" fill="#ff4ca5"/>

  <circle cx="1370" cy="105" r="170" fill="none" stroke="#ff4ca5" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="1370" cy="105" r="112" fill="none" stroke="#adff2f" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 10"/>

  <g font-family="JetBrains Mono, Consolas, monospace" font-weight="700" letter-spacing="2">
    <text x="92" y="84" fill="#67a2ff" font-size="22">STUDIO.SYSTEM // ONLINE</text>
    <text x="92" y="452" fill="#bbb5ad" font-size="18">ANGULAR 22 · DJANGO 6.1 · TYPESCRIPT · SCSS · ACCESSIBILITY · SECURITY</text>
  </g>

  <g font-family="Arial Black, Impact, sans-serif" font-weight="900">
    <text x="88" y="215" fill="#f7f2e9" font-size="104" letter-spacing="-5">DESIGN.</text>
    <text x="88" y="320" fill="#f7f2e9" font-size="104" letter-spacing="-5">CODE.</text>
    <text x="88" y="425" fill="#adff2f" font-size="104" letter-spacing="-5">REPEAT.</text>
  </g>

  <g transform="translate(1180 300)">
    <rect x="0" y="0" width="300" height="120" fill="#15191e" stroke="#f7f2e9" stroke-opacity="0.28"/>
    <rect x="0" y="0" width="300" height="28" fill="#222830"/>
    <text x="16" y="20" fill="#f7f2e9" font-size="12" font-family="JetBrains Mono, Consolas, monospace" font-weight="700">IDENTITY.CFG</text>
    <text x="18" y="58" fill="#bbb5ad" font-size="13" font-family="JetBrains Mono, Consolas, monospace">&gt; brand=Design.Code.Repeat</text>
    <text x="18" y="82" fill="#bbb5ad" font-size="13" font-family="JetBrains Mono, Consolas, monospace">&gt; mode=studio</text>
    <text x="18" y="106" fill="#adff2f" font-size="13" font-family="JetBrains Mono, Consolas, monospace">&gt; status=ready</text>
  </g>

  <g transform="translate(1320 168)">
    <text x="0" y="0" fill="#adff2f" font-size="92" font-family="Arial Black, Impact, sans-serif" font-weight="900">B²</text>
    <rect x="0" y="14" width="150" height="3" fill="#adff2f"/>
  </g>
</svg>
