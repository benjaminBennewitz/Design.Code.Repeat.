<head>
  <meta charset="utf-8">
  <title>Design. Code. Repeat. | Webentwicklung, Software & Design</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0b0d0f">
  <meta name="color-scheme" content="dark light">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Design. Code. Repeat.">
  <meta property="og:title" content="Design. Code. Repeat. | Webentwicklung, Software &amp; Design">
  <meta property="og:description" content="Webentwicklung, individuelle Software, UI/UX, Wartung und Managed Hosting aus Mönchengladbach.">
  <meta property="og:url" content="https://design-code-repeat.de/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Design. Code. Repeat. | Webentwicklung, Software &amp; Design">
  <meta name="twitter:description" content="Webentwicklung, individuelle Software, UI/UX, Wartung und Managed Hosting aus Mönchengladbach.">
  <link rel="canonical" href="https://design-code-repeat.de/">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <style>
    html.dcr-initial-load,
    html.dcr-initial-load body { overflow: hidden; }
    html.dcr-initial-load {
      --dcr-font-body: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --dcr-font-mono: Consolas, ui-monospace, monospace;
    }

    .site-loader {
      position: fixed;
      z-index: 1000;
      inset: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 2rem;
      min-height: 100svh;
      padding: clamp(1.25rem, 3vw, 3rem);
      overflow: hidden;
      background: #080808;
      color: #fff;
      opacity: 1;
      visibility: visible;
      transition: opacity 220ms ease, visibility 220ms step-end;
    }

    .site-loader.is-finished { opacity: 0; visibility: hidden; pointer-events: none; }
    .site-loader::before {
      position: absolute;
      inset: 0;
      content: '';
      background: linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);
      background-size: 12.5% 12.5%;
      opacity: .45;
      transform: scale(1.08);
      animation: dcr-loader-grid 3s ease-out forwards;
      pointer-events: none;
    }

    .site-loader__meta,
    .site-loader__footer {
      position: relative;
      z-index: 2;
      font: 800 clamp(.62rem,.72vw,.72rem)/1.15 Consolas, ui-monospace, monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .site-loader__meta,
    .site-loader__footer > div:last-child { display: flex; gap: 1rem; justify-content: space-between; }
    .site-loader__core {
      position: relative;
      z-index: 2;
      display: grid;
      width: 100%;
      grid-template-columns: max-content clamp(4rem,8.5vw,8.5rem) max-content;
      grid-template-rows: auto auto;
      gap: .06em .12em;
      align-content: center;
      align-items: center;
      justify-content: center;
      font-family: Impact, 'Arial Black', sans-serif;
      font-size: clamp(3.6rem,10.5vw,10.5rem);
      line-height: .78;
      letter-spacing: -.075em;
    }

    .site-loader__word { display: block; opacity: 0; transform: translateY(65%) skewY(7deg); animation: dcr-loader-word 720ms cubic-bezier(.22,1,.36,1) forwards; }
    .site-loader__word:nth-child(1) { animation-delay: 250ms; }
    .site-loader__word:nth-child(3) { animation-delay: 500ms; }
    .site-loader__word--accent { grid-column: 1 / -1; justify-self: center; color: #67a2ff; animation-delay: 760ms; }
    .site-loader__mark {
      position: relative;
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 8%;
      width: 100%;
      aspect-ratio: 1;
      padding: 11%;
      background: #67a2ff;
      color: #080808;
      animation: dcr-loader-mark 1.4s cubic-bezier(.22,1,.36,1) 150ms infinite alternate;
    }
    .site-loader__mark i { aspect-ratio: 1; border-radius: 50% 12% 50% 16%; background: currentColor; transform: rotate(45deg); }
    .site-loader__footer { display: grid; gap: .75rem; }
    .site-loader__progress { height: .45rem; overflow: hidden; background: rgba(255,255,255,.2); }
    .site-loader__progress span { display: block; width: 100%; height: 100%; background: #67a2ff; transform: scaleX(0); transform-origin: left; animation: dcr-loader-progress 3s linear forwards; }

    @keyframes dcr-loader-word { to { opacity: 1; transform: none; } }
    @keyframes dcr-loader-progress { to { transform: scaleX(1); } }
    @keyframes dcr-loader-grid { to { opacity: .16; transform: scale(1); } }
    @keyframes dcr-loader-mark {
      0% { border-radius: 0; transform: rotateY(0) scale(1); }
      48% { border-radius: 42% 18% 44% 22%; transform: rotateY(180deg) scale(.82); }
      100% { border-radius: 50%; transform: rotateY(360deg) scale(1); }
    }

    @media (max-width: 680px) {
      .site-loader { padding: 1rem; }
      .site-loader__core { grid-template-columns: max-content clamp(2.35rem,12vw,4rem) max-content; gap: .06em; font-size: clamp(2.15rem,10.8vw,4.2rem); }
      .site-loader__word { white-space: nowrap; }
      .site-loader__meta span:last-child,
      .site-loader__footer > div:last-child span:last-child { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .site-loader { transition: none; }
      .site-loader::before,
      .site-loader__mark { animation: none; }
      .site-loader__word { opacity: 1; transform: none; animation: none; }
    }
  </style>
</head>
<body>
  <dcr-root></dcr-root>

  <div id="dcr-site-loader" class="site-loader" role="status" aria-live="polite" aria-busy="true" aria-label="Website wird geladen">
    <div class="site-loader__meta" aria-hidden="true">
      <span>B² // DESIGN. CODE. REPEAT.</span>
      <span>SYSTEMSTART</span>
    </div>

    <div class="site-loader__core" aria-hidden="true">
      <span class="site-loader__word">DESIGN.</span>
      <span class="site-loader__mark"><i></i><i></i><i></i><i></i></span>
      <span class="site-loader__word">CODE.</span>
      <span class="site-loader__word site-loader__word--accent">REPEAT.</span>
    </div>

    <div class="site-loader__footer" aria-hidden="true">
      <div class="site-loader__progress"><span></span></div>
      <div><span>INITIALIZING EXPERIENCE</span><span>03.0 SEC</span></div>
    </div>
  </div>

  <script src="/loader-init.js"></script>
</body>
</html>
