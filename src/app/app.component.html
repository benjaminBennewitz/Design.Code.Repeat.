<div class="app-shell">
  <a class="skip-link" href="#main-content">{{ languageService.language() === 'de' ? 'Zum Hauptinhalt' : 'Skip to main content' }}</a>
  <dcr-header />

  @defer (on timer(3500ms)) {
    <dcr-accessibility-panel />
    <dcr-cookie-banner />
    <dcr-scroll-to-top />
  }

  <div id="main-content" tabindex="-1" [class.is-route-changing]="isRouteChanging()">
    <router-outlet />
  </div>

  @defer (on viewport) {
    <dcr-footer [class.is-route-changing]="isRouteChanging()" />
  } @placeholder {
    <div class="site-footer-placeholder" aria-hidden="true"></div>
  }
</div>
